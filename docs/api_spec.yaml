openapi: 3.0.3
info:
  title: UDMS Image Classifier API
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /:
    get:
      summary: Welcome message
      operationId: getWelcome
      responses:
        "200":
          description: Welcome response
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - version
                properties:
                  message:
                    type: string
                  version:
                    type: string

  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Health status response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - model_loaded
                  - model_version
                properties:
                  status:
                    type: string
                  model_loaded:
                    type: boolean
                  model_version:
                    type: string

  /api/v1/classify:
    post:
      summary: Classify urban disorder image
      operationId: classifyImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to classify. Maximum size is 10MB.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "200":
          description: Classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"
        "400":
          description: Bad request (invalid file type or file too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error during model inference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    PredictionResult:
      type: object
      required:
        - category
        - category_label
        - confidence
        - requires_review
      properties:
        category:
          type: string
          enum:
            - bad_drainage
            - damaged_signage
            - illegal_dumping
            - potholes
            - vegetation_overgrowth
        category_label:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        requires_review:
          type: boolean

    AlternativeResult:
      type: object
      required:
        - category
        - confidence
      properties:
        category:
          type: string
          enum:
            - bad_drainage
            - damaged_signage
            - illegal_dumping
            - potholes
            - vegetation_overgrowth
        confidence:
          type: number
          format: float

    ClassifyResponse:
      type: object
      required:
        - prediction
        - alternatives
        - model_version
        - inference_time_ms
      properties:
        prediction:
          $ref: "#/components/schemas/PredictionResult"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/AlternativeResult"
        model_version:
          type: string
        inference_time_ms:
          type: number
          format: float

    ErrorResponse:
      type: object
      required:
        - error
        - detail
      properties:
        error:
          type: string
        detail:
          type: string
